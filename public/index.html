<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atreads — Mesin Pencari Barcode ShopeePay</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:28px;background:#f5f6f8;color:#18202a}h1{margin-bottom:6px}p{color:#5c6673}.bar{display:flex;gap:8px;margin:22px 0}.bar input{flex:1;padding:14px;border:1px solid #ccd2da;border-radius:10px;font-size:16px}.bar button{padding:14px 20px;border:0;border-radius:10px;background:#ee4d2d;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #e1e5ea;border-radius:14px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover;background:#eee}.body{padding:14px}.ok{color:#16803c;font-weight:700}.muted{font-size:13px;color:#687381;word-break:break-word}.empty{padding:30px;background:#fff;border-radius:14px}.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#eef2f6;font-size:12px}</style></head><body><h1>Atreads</h1><p>Mesin pencari gambar publik untuk menemukan kandidat QR/barcode ShopeePay dan memeriksa payload QR yang berhasil dibaca.</p><div class="bar"><input id="q" value="ShopeePay QR barcode" placeholder="Cari gambar, misalnya: ShopeePay QR barcode"><button onclick="go()">Cari & Scan</button></div><div id="status" class="muted"></div><div id="results" class="grid"></div><script>async function go(){const q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('status').textContent='Mencari gambar publik dan mencoba membaca QR...';document.getElementById('results').innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw Error(d.error||'Pencarian gagal');document.getElementById('status').textContent=d.results.length+' gambar ditemukan; '+d.scanned+' gambar berhasil dipindai.';document.getElementById('results').innerHTML=d.results.map(x=>'<article class="card"><img loading="lazy" src="'+esc(x.image)+'" onerror="this.style.display=\'none\'"><div class="body"><div class="badge">'+esc(x.source)+'</div><h3>'+esc(x.title||'Gambar hasil pencarian')+'</h3>'+(x.shopeePay?'<div class="ok">Kandidat ShopeePay terdeteksi</div>':'<div class="muted">QR belum terkonfirmasi sebagai ShopeePay</div>')+(x.qr?'<p><b>Payload:</b><br><span class="muted">'+esc(x.qr)+'</span></p>':'')+'<p><a target="_blank" rel="noopener" href="'+esc(x.page||x.image)+'">Buka sumber</a></p></div></article>').join('')||'<div class="empty">Tidak ada gambar yang cocok.</div>'}catch(e){document.getElementById('status').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
